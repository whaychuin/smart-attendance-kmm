<!DOCTYPE html>
<html>
<head>
  <title>Attendify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="header-card">
      <h1>Attendify</h1>
      <p>Unit Biologi | Kolej Matrikulasi Melaka</p>
      <span>Smart Attendance Management System</span>
    </div>

    <form id="attendanceForm">

      <div class="section-title">Maklumat Kelas</div>

      <label>Tarikh</label>
      <input type="date" id="date" required>

      <label>Nama Pensyarah</label>
      <select id="pensyarah" required>
  <option value="">Pilih pensyarah</option>
</select>

      <label>Mod</label>
      <select id="mod" required>
  <option value="">Pilih mod</option>
  <option>Kuliah</option>
  <option>Tutorial</option>
  <option>Amali</option>
</select>

      <label>Praktikum</label>
      <select id="praktikum" required>
  <option value="">Pilih praktikum</option>
</select>

      <div class="section-title">Maklumat Pelajar</div>

      <label>No Matrik</label>
      <input type="text" id="noMatrik" placeholder="Contoh: MS24123456" required>

      <label>Nama Pelajar</label>
      <input type="text" id="namaPelajar" placeholder="Nama penuh pelajar" required>

      <label>Status Kehadiran</label>
      <select id="status" required>
        <option value="">Pilih status</option>
        <option>Hadir</option>
        <option>Tidak Hadir</option>
        <option>Lewat</option>
        <option>MC</option>
        <option>Urusan Rasmi</option>
      </select>

      <label>Catatan</label>
      <input type="text" id="catatan" placeholder="Contoh: MC / Lewat 10 minit / Tiada">

      <button type="submit">Hantar Kehadiran</button>
    </form>

    <p id="message"></p>

    <p class="footer">Smart Attendance KMM | Prototype Version 1.0</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
